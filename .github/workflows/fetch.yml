name: Fetch Licitaciones (Scheduled Safe Merge)

# BRANCH NOTE
# Production data now lives on main after v0.5.0b promotion.
# experimental/wip remains the integration/canon development lane.
# extensions remains a separate branch/worktree for non-licitaciones surfaces.

# ============================================================
# BRANCH NOTE
# This workflow checks out branch 'main'.
# Production data lives on main after v0.5.0b promotion.
# experimental/wip remains the integration/canon development lane.
# extensions remains a separate branch/worktree for non-licitaciones surfaces.
# ============================================================
#
# Schedule strategy: DST-safe option B
#   cron fires at 06:00, 07:00, 15:00, 16:00 UTC every day.
#   A Python guard (step: local-time-guard) computes Europe/Madrid
#   local time via zoneinfo and only sets RUN_FETCH=true when
#   local hour is 08 or 17. Other cron fires exit cleanly.
#
# workflow_dispatch inputs:
#   dry_run  — if "true", skip live fetch (diagnostic only)
#   force_run — if "true", bypass local-hour guard (run regardless of Madrid time)

on:
  schedule:
    - cron: "0 6 * * *"   # CEST morning  -> 08:00 Madrid (summer, UTC+2)
    - cron: "0 7 * * *"   # CET  morning  -> 08:00 Madrid (winter, UTC+1)
    - cron: "0 15 * * *"  # CEST evening  -> 17:00 Madrid (summer, UTC+2)
    - cron: "0 16 * * *"  # CET  evening  -> 17:00 Madrid (winter, UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = skip live fetch, run diagnostic only"
        required: false
        default: "false"
      force_run:
        description: "true = bypass local-hour guard (run regardless of Madrid time)"
        required: false
        default: "false"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AUTOMATION_ID: ADGOPS_AUTO_FETCHER1_SCHEDULED
      AUTOMATION_KIND: fetcher1-scheduled
      AUTOMATION_DATA_FILE: data/licitaciones.json
      AUTOMATION_SOURCES: "PLACSP-643, PLACSP-1044"

    steps:
      - name: Checkout repo (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tzdata

      - name: Nominal-schedule guard (Europe/Madrid)
        id: time_guard
        run: |
          python - <<'PYEOF'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          force          = os.environ.get("INPUT_FORCE_RUN", "false").lower() == "true"
          is_manual      = os.environ.get("GITHUB_EVENT_NAME", "") == "workflow_dispatch"
          dry_run        = os.environ.get("INPUT_DRY_RUN", "false").lower() == "true"
          event_name     = os.environ.get("GITHUB_EVENT_NAME", "unknown")
          event_schedule = os.environ.get("EVENT_SCHEDULE", "").strip()

          now          = datetime.now(ZoneInfo("Europe/Madrid"))
          offset_hours = int(now.utcoffset().total_seconds() // 3600)

          # Each nominal slot is valid only when Madrid is at the matching UTC offset.
          # This makes the guard robust to delayed cron start times.
          SLOT_OFFSET = {
              "0 6 * * *":  2,   # CEST morning  -> 08:00 Madrid
              "0 15 * * *": 2,   # CEST evening  -> 17:00 Madrid
              "0 7 * * *":  1,   # CET  morning  -> 08:00 Madrid
              "0 16 * * *": 1,   # CET  evening  -> 17:00 Madrid
          }

          if force or is_manual:
              run_fetch = "true"
              reason    = "manual/forced dispatch"
          elif event_schedule in SLOT_OFFSET:
              expected = SLOT_OFFSET[event_schedule]
              if offset_hours == expected:
                  run_fetch = "true"
                  reason    = f"nominal slot '{event_schedule}' matches Madrid UTC+{offset_hours}h"
              else:
                  run_fetch = "skip"
                  reason    = f"nominal slot '{event_schedule}' expects UTC+{expected}h but Madrid is UTC+{offset_hours}h — DST mismatch, skipping"
          else:
              run_fetch = "skip"
              reason    = f"unrecognised schedule '{event_schedule}' — skipping"

          print(
              f"[guard] event={event_name}"
              f" schedule='{event_schedule}'"
              f" Madrid={now.strftime('%Y-%m-%d %H:%M %Z')}"
              f" UTC_offset=+{offset_hours}h"
              f" reason={reason}"
              f" RUN_FETCH={run_fetch}"
          )

          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"RUN_FETCH={run_fetch}\n")
              fh.write(f"DRY_RUN_MODE={'true' if dry_run else 'false'}\n")
              # Context for the operational summary step (single-line values).
              fh.write(f"GUARD_EVENT={event_name}\n")
              fh.write(f"GUARD_SCHEDULE={event_schedule}\n")
              fh.write(f"GUARD_MADRID={now.strftime('%Y-%m-%d %H:%M %Z')}\n")
              fh.write(f"GUARD_OFFSET=+{offset_hours}h\n")
              fh.write(f"GUARD_REASON={reason}\n")
              fh.write(f"GUARD_FORCE={'true' if force else 'false'}\n")
              fh.write(f"GUARD_DRY_RUN_INPUT={'true' if dry_run else 'false'}\n")
          PYEOF
        env:
          INPUT_FORCE_RUN: ${{ inputs.force_run || 'false' }}
          INPUT_DRY_RUN:   ${{ inputs.dry_run   || 'false' }}
          EVENT_SCHEDULE:  ${{ github.event.schedule || '' }}

      - name: Run scheduled helper (live fetch + lifecycle-safe merge)
        id: helper
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tmp
          # set -o pipefail: the helper's exit code propagates through tee, so a
          # fail-closed refusal (EMPTY_FAILURE / partial candidate) fails the step
          # instead of being masked by tee's own exit 0.
          python tools/scheduled_fetch_merge.py --run-live --allow-production-write 2>&1 | tee _tmp/run_helper.log

      - name: Diagnostic only (dry_run=true)
        id: dryrun
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tmp
          # set -o pipefail: a non-zero --check / --validate-production must fail the
          # step even though it is piped through tee.
          echo "[workflow] dry_run=true — running --check only, no production write" | tee _tmp/run_helper.log
          python tools/scheduled_fetch_merge.py --check | tee -a _tmp/run_helper.log
          python tools/scheduled_fetch_merge.py --validate-production | tee -a _tmp/run_helper.log

      - name: Validate production JSON
        id: validate
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'false'
        run: |
          python -m json.tool data/licitaciones.json > /dev/null
          echo "data/licitaciones.json: valid JSON"

      - name: Diff summary
        id: diffsummary
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'false'
        run: |
          git diff --stat
          if git diff --quiet -- data/licitaciones.json; then
            echo "MONOLITH_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "MONOLITH_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Build data shards (freshness sync)
        id: shards
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'false' && env.MONOLITH_CHANGED == 'true'
        run: |
          python tools/build_data_shards.py \
            --input data/licitaciones.json \
            --out-dir data \
            --years 2026,2025,2024 \
            --archive-name archive \
            --manifest data/licitaciones_manifest.json

      - name: Validate canonical public contract (publication gate)
        id: shardvalidate
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'false' && env.MONOLITH_CHANGED == 'true'
        run: |
          python - <<'PYEOF'
          # Canonical public contract gate (A1 — adgops.public.licitaciones/1).
          # Replaces the legacy freshness gate, which required the contradictory
          # source_meta.production_write_performed / scheduled_merge_applied_at
          # pair. Runs after the merger and the shard builder, before commit and
          # push: any failure exits non-zero and no data is published.
          #
          # All canonical contract logic — schema constants, publication state,
          # shared keys, hash serialization, generation-id + timestamp
          # validation, forbidden key/path families — comes from the shared
          # module tools/public_contract.py (A1 LOCK-19). Only workflow-local
          # orchestration (file reads, shard walk) lives here. Failure messages
          # name the violated invariant / family only — never dataset contents.
          import hashlib, json, os, sys

          # Import the shared contract from the checked-out tree. This adjusts
          # only this script's import path; it changes no checkout, fetch,
          # merge, shard-build, commit, no-change or push behaviour.
          sys.path.insert(0, os.getcwd())
          try:
              from tools import public_contract as pc
          except ImportError:
              sys.path.insert(0, os.path.join(os.getcwd(), "tools"))
              import public_contract as pc

          MONOLITH_PATH = "data/licitaciones.json"
          MANIFEST_PATH = "data/licitaciones_manifest.json"

          errors = []
          def fail(msg):
              errors.append(msg)

          # Read the monolith bytes once — needed both for the file-integrity
          # hash (A1 §15) and for the records array.
          with open(MONOLITH_PATH, "rb") as f:
              monolith_bytes = f.read()
          monolith = json.loads(monolith_bytes.decode("utf-8"))
          with open(MANIFEST_PATH, encoding="utf-8") as f:
              manifest = json.load(f)

          records = monolith.get("data")
          if not isinstance(records, list):
              fail("monolith.data is not an array")
              records = []
          mono_meta = monolith.get("meta") or {}
          man_meta  = manifest.get("meta") or {}

          # 1. Canonical envelopes present.
          if not isinstance(mono_meta, dict) or not mono_meta:
              fail("monolith: canonical public meta envelope missing")
          if not isinstance(man_meta, dict) or not man_meta:
              fail("manifest: canonical meta envelope missing (expected manifest.meta)")

          # 2. Schema identity, publication state, artifact discriminator.
          for label, meta, artifact in (
                  ("monolith", mono_meta, pc.ARTIFACT_MONOLITH),
                  ("manifest", man_meta, pc.ARTIFACT_MANIFEST)):
              if meta.get("schema") != pc.PUBLIC_SCHEMA:
                  fail("%s.meta.schema is not the canonical public schema" % label)
              if meta.get("schema_version") != pc.PUBLIC_SCHEMA_VERSION:
                  fail("%s.meta.schema_version is not %d" % (label, pc.PUBLIC_SCHEMA_VERSION))
              if meta.get("publication_state") != pc.PUBLICATION_STATE:
                  fail("%s.meta.publication_state is not %r" % (label, pc.PUBLICATION_STATE))
              if meta.get("artifact") != artifact:
                  fail("%s.meta.artifact is not %r" % (label, artifact))

          # 3. Generation identity.
          gen = mono_meta.get("generation_id")
          if not pc.is_valid_generation_id(gen):
              fail("monolith.meta.generation_id missing or malformed "
                   "(expected gen-<YYYYMMDDTHHMMSSZ>-<12 hex>)")
              gen = None

          # 4. Logical dataset hash — independent recomputation over the records
          #    array with the serialization locked in A1 §7.2.
          declared = mono_meta.get("dataset_sha256")
          actual = pc.compute_dataset_sha256(records)
          if declared != actual:
              fail("monolith.meta.dataset_sha256 does not match a fresh recomputation "
                   "over the records array")
          if gen and not pc.generation_id_matches(
                  gen, mono_meta.get("dataset_generated_at"), actual):
              fail("generation_id does not match dataset_generated_at prefix / "
                   "dataset_sha256[:12] suffix")

          # 5. Shared fields byte-identical in monolith and manifest (A1 §12).
          for key in pc.SHARED_META_KEYS:
              if mono_meta.get(key) != man_meta.get(key):
                  fail("shared meta field '%s' differs between monolith and manifest" % key)

          # 6. Counts reconcile.
          mono_counts = mono_meta.get("counts") or {}
          if mono_counts.get("records") != len(records):
              fail("meta.counts.records != monolith record count")
          expected_canonical = pc.compute_canonical_record_count(records)
          if mono_counts.get("canonical_records") != expected_canonical:
              fail("meta.counts.canonical_records does not match the canonical consumer view")
          mono_block = manifest.get("monolith") or {}
          if mono_block.get("record_count") != len(records):
              fail("manifest.monolith.record_count != monolith record count")

          # 6b. Monolith FILE integrity (A1 §15): the manifest's byte hash of the
          #     finished monolith file must match a fresh recomputation. Distinct
          #     from the logical dataset_sha256 over the records array above.
          file_sha = hashlib.sha256(monolith_bytes).hexdigest()
          if mono_block.get("file_sha256") != file_sha:
              fail("manifest.monolith.file_sha256 does not match the monolith file bytes")
          if mono_block.get("bytes") != len(monolith_bytes):
              fail("manifest.monolith.bytes does not match the monolith file size")

          # 7. Shard inventory and integrity.
          shards = manifest.get("shards")
          if not isinstance(shards, list):
              fail("manifest.shards is not an array")
              shards = []
          elif not shards:
              fail("manifest.shards[] is empty")
          shard_total = 0
          for shard in shards:
              path = shard.get("path")
              if not path or not os.path.isfile(path):
                  fail("shard file missing or not listed")
                  continue
              with open(path, "rb") as sf:
                  raw = sf.read()
              if shard.get("sha256") != hashlib.sha256(raw).hexdigest():
                  fail("shard sha256 mismatch: %s" % path)
              if shard.get("bytes") != len(raw):
                  fail("shard byte count mismatch: %s" % path)
              if shard.get("priority") is None:
                  fail("shard entry missing priority: %s" % path)
              sj = json.loads(raw.decode("utf-8"))
              sdata = sj.get("data")
              if not isinstance(sdata, list):
                  fail("shard data is not an array: %s" % path)
                  sdata = []
              smeta = sj.get("meta") or {}
              if shard.get("record_count") != len(sdata):
                  fail("manifest record_count != actual records in %s" % path)
              if gen and smeta.get("generation_id") != gen:
                  fail("shard generation_id does not match the monolith generation: %s" % path)
              if smeta.get("dataset_sha256") != declared:
                  fail("shard dataset_sha256 does not match the monolith: %s" % path)
              if smeta.get("publication_state") != pc.PUBLICATION_STATE:
                  fail("shard publication_state is not published: %s" % path)
              if smeta.get("artifact") != pc.ARTIFACT_SHARD:
                  fail("shard meta.artifact is not 'shard': %s" % path)
              for k in pc.find_forbidden_keys(smeta):
                  fail("shard %s: forbidden metadata key family '%s'" % (path, k))
              # A shard meta is NOT a canonical meta block: pipeline.version is
              # forbidden here too, so the exception is explicitly withheld.
              for vp in pc.find_forbidden_version_paths(smeta, allow_pipeline_version=False):
                  fail("shard %s: forbidden public version path '%s' (pipeline.version allowed only in monolith.meta / manifest.meta)" % (path, vp))
              for fam in pc.find_forbidden_paths(smeta):
                  fail("shard %s: forbidden internal path/host family '%s'" % (path, fam))
              shard_total += len(sdata)
          if shard_total != len(records):
              fail("sum of shard record counts != monolith count")

          # 8. Timestamps: format and the A1 §7.3 ordering relationship.
          sra = mono_meta.get("source_retrieved_at")
          dga = mono_meta.get("dataset_generated_at")
          aba = man_meta.get("artifacts_built_at")
          for label, value in (("monolith.meta.source_retrieved_at", sra),
                               ("monolith.meta.dataset_generated_at", dga),
                               ("manifest.meta.artifacts_built_at", aba)):
              if not pc.is_rfc3339_z(value):
                  fail("%s missing or not RFC3339 UTC second precision" % label)
          if pc.is_rfc3339_z(sra) and pc.is_rfc3339_z(dga) and pc.is_rfc3339_z(aba):
              if not pc.timestamps_non_decreasing(sra, dga, aba):
                  fail("timestamp ordering violated: source_retrieved_at <= "
                       "dataset_generated_at <= artifacts_built_at")

          # 9. Recursive forbidden key / path-family absence across every public
          #    metadata structure (A1 §13, §14). Scoped to METADATA only —
          #    record-level bookkeeping is a separate, deferred lane (LOCK-17/A3).
          if "source_meta" in manifest:
              fail("manifest: legacy source_meta envelope still present")
          for k in pc.FORBIDDEN_MANIFEST_TOP_KEYS:
              if k in manifest:
                  fail("manifest: legacy/forbidden top-level key '%s' still present" % k)
          # Context-aware version policy (A1 §7.1, p252 §6-§8): the
          # pipeline.version exception is granted ONLY to the two canonical meta
          # blocks (monolith.meta / manifest.meta). manifest.monolith and
          # manifest.shards are not meta blocks, so any pipeline.version there is
          # rejected. The policy is passed explicitly at every site so the
          # contract is auditable straight from this workflow diff.
          for label, block, allow_pv in (("monolith.meta", mono_meta, True),
                                          ("manifest.meta", man_meta, True),
                                          ("manifest.monolith", mono_block, False),
                                          ("manifest.shards", shards, False)):
              for k in pc.find_forbidden_keys(block):
                  fail("%s: forbidden metadata key family '%s'" % (label, k))
              for vp in pc.find_forbidden_version_paths(block, allow_pipeline_version=allow_pv):
                  fail("%s: forbidden public version path '%s' (pipeline.version allowed only in monolith.meta / manifest.meta)" % (label, vp))
              for fam in pc.find_forbidden_paths(block):
                  fail("%s: forbidden internal path/host family '%s'" % (label, fam))

          if errors:
              print("CANONICAL PUBLIC CONTRACT GATE: FAILED")
              for e in errors:
                  print(" -", e)
              sys.exit(1)

          print("Canonical public contract gate OK: generation_id=%s records=%d "
                "canonical=%d shards=%d shard_total=%d"
                % (gen, len(records), canon, len(shards), shard_total))
          PYEOF

      - name: Commit data if changed
        id: commit
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'false'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/licitaciones.json data/licitaciones_manifest.json data/licitaciones_2026.json data/licitaciones_2025.json data/licitaciones_2024.json data/licitaciones_archive.json
          if git diff --cached --quiet; then
            echo "no data changes to commit"
            echo "DATA_CHANGED=false" >> "$GITHUB_ENV"
          else
            # A commit is created only when the helper succeeded, validation passed and
            # data changed — so the commit-time operational status is, by construction,
            # SUCCESS_REAL_FETCH_WRITE. A later push failure cannot be known here; the
            # operational summary (not the commit body) reports FAIL_CLOSED_GIT_PUSH.
            COMMIT_SUBJECT="data(auto/fetcher1-scheduled): update licitaciones [run #${{ github.run_number }} | SUCCESS_REAL_FETCH_WRITE]"
            COMMIT_TRAILERS="Automation-ID: ${AUTOMATION_ID}
          Workflow: Fetch Licitaciones Scheduled Safe Merge
          GitHub-Run: ${{ github.run_number }}
          Operational-Status: SUCCESS_REAL_FETCH_WRITE
          Data-File: ${AUTOMATION_DATA_FILE}
          Sources: ${AUTOMATION_SOURCES}
          Trigger: ${GUARD_EVENT:-unknown} ${GUARD_SCHEDULE:-}
          Madrid-Time: ${GUARD_MADRID:-unknown} (${GUARD_OFFSET:-?})
          Guard-Reason: ${GUARD_REASON:-unknown}"
            git commit -m "$COMMIT_SUBJECT" -m "$COMMIT_TRAILERS"
            echo "DATA_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Push
        id: push
        if: env.RUN_FETCH == 'true' && env.DRY_RUN_MODE == 'false' && env.DATA_CHANGED == 'true'
        run: |
          git push

      - name: Operational summary
        if: always()
        env:
          HELPER_OUTCOME:      ${{ steps.helper.outcome }}
          DRYRUN_OUTCOME:      ${{ steps.dryrun.outcome }}
          VALIDATE_OUTCOME:    ${{ steps.validate.outcome }}
          DIFFSUMMARY_OUTCOME: ${{ steps.diffsummary.outcome }}
          COMMIT_OUTCOME:      ${{ steps.commit.outcome }}
          PUSH_OUTCOME:        ${{ steps.push.outcome }}
          GH_EVENT_NAME:       ${{ github.event_name }}
          GH_RUN_NUMBER:       ${{ github.run_number }}
        run: |
          mkdir -p _tmp
          # Operational-status classification, Step Summary, OPERATIONAL_STATUS env,
          # and the p188 machine-readable run report are produced by the single
          # source of truth in tools/scheduled_run_classify.py (extracted from the
          # former inline heredoc in p190; behaviour-preserving). The same module is
          # imported by the offline regression harness so workflow and tests agree.
          python tools/scheduled_run_classify.py

      - name: Upload fail-closed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adgops-auto-fetcher1-scheduled-diagnostics-${{ github.run_number }}
          path: |
            _tmp/scheduled_live_candidate_*.json
            _tmp/scheduled_merge_conflicts_live_*.json
            _tmp/scheduled_run_report_*.json
            _tmp/run_helper.log
          retention-days: 7
          if-no-files-found: ignore
